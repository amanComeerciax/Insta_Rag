<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaveSort AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 330px; background: #000000; color: #ffffff; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #262626; }
    .brand { font-weight: 700; font-size: 14px; color: #ffffff; }
    .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: #171717; color: #a3a3a3; border: 1px solid #262626; }
    .info { font-size: 11px; color: #a3a3a3; margin-bottom: 12px; line-height: 1.4; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #a3a3a3; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 8px 10px; background: #0a0a0a; border: 1px solid #262626; border-radius: 6px; color: #fff; font-size: 12px; }
    input:focus, select:focus { outline: none; border-color: #ffffff; }
    .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 12px; }
    .btn-primary { background: #ffffff; color: #000000; margin-top: 6px; }
    .btn-primary:hover { background: #e5e5e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #171717; color: #ffffff; border: 1px solid #262626; margin-top: 6px; }
    .btn-secondary:hover { background: #262626; }
    .results { margin-top: 12px; padding: 10px; border-radius: 6px; background: #0a0a0a; border: 1px solid #262626; font-size: 11px; display: none; line-height: 1.4; }
    .link { display: block; text-align: center; margin-top: 12px; color: #737373; font-size: 11px; text-decoration: none; }
    .link:hover { color: #ffffff; }
    .tip { font-size: 10px; color: #525252; margin-top: 8px; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">SaveSort AI</div>
    <span class="status-badge" id="badge">Ready</span>
  </div>

  <p class="info">
    Open <strong style="color:#fff;">instagram.com/.../saved/</strong> and select how many posts to auto-scroll & sync.
  </p>

  <div class="field">
    <label for="postLimit">Auto-Scroll Post Target</label>
    <select id="postLimit">
      <option value="30">Auto-Scroll ~30 posts (Fast • ~10 sec)</option>
      <option value="60" selected>Auto-Scroll ~60 posts (~20 sec)</option>
      <option value="120">Auto-Scroll ~120 posts (~40 sec)</option>
      <option value="visible">Only visible posts on screen (No scroll)</option>
    </select>
  </div>

  <button id="autoSyncBtn" class="btn btn-primary">
    ⚡ Auto-Scroll & Sync Posts
  </button>

  <div id="results" class="results"></div>

  <p class="tip">
    💡 For 1,000+ old historical posts, download Instagram's official export ZIP from Settings and drop it in SaveSort AI (/onboarding).
  </p>

  <a href="http://localhost:3000/dashboard" target="_blank" class="link">
    Open Dashboard →
  </a>

  <!-- Hidden config -->
  <input type="hidden" id="apiUrl" value="http://localhost:3000/api/import/extension" />
  <input type="hidden" id="secretKey" value="savesort_ext_secret" />

  <script src="popup.js"></script>
</body>
</html>
